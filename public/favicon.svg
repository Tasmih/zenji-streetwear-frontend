<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Deep Atelier Black -->
    <linearGradient id="zenjiDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#zenjiDarkBg)" stroke="#1a1c22" stroke-width="2" />

  <!-- Corner Brackets (Tokyo Technical Fashion Aesthetic) -->
  <path d="M 18 30 L 18 18 L 30 18" stroke="#d4ff00" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 110 98 L 110 110 L 98 110" stroke="#d4ff00" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Neon Active Status Indicator -->
  <circle cx="108" cy="20" r="4.5" fill="#d4ff00" filter="url(#neonGlow)" />

  <!-- Architectural ZENJI 'Z' Monogram -->
  <path
    d="M 32 34 L 96 34 L 96 46 L 54 82 L 96 82 L 96 94 L 32 94 L 32 82 L 74 46 L 32 46 Z"
    fill="#FFFFFF"
  />

  <!-- Neon Lime Slash Detail Across Diagonal Axis -->
  <polygon
    points="59,62 70,62 77,68 66,68"
    fill="#d4ff00"
    filter="url(#neonGlow)"
  />

  <!-- Micro Technical Sub-label -->
  <line x1="32" y1="102" x2="52" y2="102" stroke="#d4ff00" stroke-width="2.5" stroke-linecap="round" />
  <line x1="58" y1="102" x2="68" y2="102" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
</svg>